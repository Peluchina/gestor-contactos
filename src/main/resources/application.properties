spring.application.name=gestor-contactos

spring.datasource.url=jdbc:mysql://localhost:3306/gestor_contactos?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.uploads.directory=uploads

app.bootstrap.admin.username=${INITIAL_ADMIN_USERNAME:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}
