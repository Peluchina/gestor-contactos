<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear persona natural | Gestor de Contactos</title>
    <link rel="stylesheet" th:href="@{/css/contact-document-validation.css}">
</head>
<body>
<main>
    <h1>Crear persona natural</h1>
    <a th:href="@{/contactos}">Volver a contactos</a>
    <form th:action="@{/contactos/natural}" th:object="${form}" method="post" enctype="multipart/form-data"
          data-document-validation>
        <div th:if="${#fields.hasGlobalErrors()}" role="alert">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <label>Nombres <input type="text" th:field="*{firstNames}" required></label>
        <label>Apellidos <input type="text" th:field="*{lastNames}" required></label>
        <label>Tipo de documento
            <select id="document-type" data-document-type th:field="*{documentType}" required>
                <option value="DNI">DNI</option>
                <option value="CARNET_EXTRANJERIA">Carnet de Extranjería</option>
            </select>
        </label>
        <label for="document-number">Número de documento</label>
        <input id="document-number" class="document-number-input" data-document-number
               type="text" th:field="*{documentNumber}" inputmode="numeric" maxlength="8"
               pattern="[0-9]{8}" aria-describedby="document-number-feedback" required>
        <p id="document-number-feedback" class="document-feedback" data-document-feedback
           aria-live="polite" role="status"></p>
        <label>Dirección <input type="text" th:field="*{address}" required></label>
        <label>Fotografía (opcional)
            <input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
        </label>
        <fieldset>
            <legend>Teléfonos</legend>
            <div id="phone-rows" data-collection="phones">
                <fieldset th:each="phone, item : ${form.phones}" data-row>
                    <legend th:text="${'Teléfono ' + (item.index + 1)}"></legend>
                    <label th:for="${'phone-type-' + item.index}">Tipo</label>
                    <select th:id="${'phone-type-' + item.index}"
                            th:name="${'phones[' + item.index + '].phoneType'}" required>
                        <option value="CELULAR" th:selected="${phone.phoneType == T(com.gestorcontactos.gestor_contactos.entity.PhoneType).CELULAR}">Celular</option>
                        <option value="FIJO" th:selected="${phone.phoneType == T(com.gestorcontactos.gestor_contactos.entity.PhoneType).FIJO}">Fijo</option>
                    </select>
                    <label th:for="${'phone-area-' + item.index}">Código de área</label>
                    <input type="text" th:id="${'phone-area-' + item.index}"
                           th:name="${'phones[' + item.index + '].areaCode'}" th:value="${phone.areaCode}">
                    <label th:for="${'phone-number-' + item.index}">Número</label>
                    <input type="text" th:id="${'phone-number-' + item.index}"
                           th:name="${'phones[' + item.index + '].phoneNumber'}"
                           th:value="${phone.phoneNumber}" required>
                    <button type="button" data-remove-row>Quitar teléfono</button>
                </fieldset>
            </div>
            <button type="button" data-add-row="phone-rows">Agregar teléfono</button>
        </fieldset>
        <fieldset>
            <legend>Correos electrónicos</legend>
            <div id="email-rows" data-collection="emails">
                <fieldset th:each="email, item : ${form.emails}" data-row>
                    <legend th:text="${'Correo ' + (item.index + 1)}"></legend>
                    <label th:for="${'email-' + item.index}">Correo electrónico</label>
                    <input type="email" th:id="${'email-' + item.index}"
                           th:name="${'emails[' + item.index + '].email'}" th:value="${email.email}" required>
                    <button type="button" data-remove-row>Quitar correo</button>
                </fieldset>
            </div>
            <button type="button" data-add-row="email-rows">Agregar correo electrónico</button>
        </fieldset>
        <label>Relaciones comerciales
            <select th:field="*{commercialTypes}" multiple required>
                <option th:each="type : ${commercialTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
        </label>
        <button type="submit">Crear contacto</button>
    </form>
</main>
<script th:src="@{/js/contact-collections.js}" defer></script>
<script th:src="@{/js/document-validation.js}" defer></script>
</body>
</html>
