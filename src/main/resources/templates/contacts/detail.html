<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de contacto | Gestor de Contactos</title>
</head>
<body>
<main>
    <a th:href="@{/contactos}">Volver a contactos</a>
    <h1 th:text="${contact.displayName}"></h1>
    <p>Tipo de persona: <span th:text="${contact.personType}"></span></p>
    <p>Dirección: <span th:text="${contact.address}"></span></p>
    <section th:unless="${restrictedView}">
        <a th:if="${canEdit}" th:href="@{/contactos/{id}/editar(id=${contact.id})}">Editar datos permitidos</a>
        <figure th:if="${photoUrl}">
            <img th:src="${photoUrl}" alt="Fotografía del contacto">
        </figure>
        <p th:unless="${photoUrl}">Este contacto no tiene fotografía.</p>
        <p>Documento: <span th:text="${contact.documentType + ' ' + contact.documentNumber}"></span></p>
        <p>Estado: <span th:text="${contact.status}"></span></p>
        <form th:if="${canChangeStatus}" th:action="@{/contactos/{id}/estado(id=${contact.id})}" method="post">
            <button th:if="${contact.status.name() == 'ACTIVO'}" type="submit" name="status" value="INACTIVO">
                Inactivar contacto
            </button>
            <button th:if="${contact.status.name() == 'INACTIVO'}" type="submit" name="status" value="ACTIVO">
                Activar contacto
            </button>
        </form>
        <p>Relaciones: <span th:text="${contact.commercialTypes}"></span></p>
        <h2>Teléfonos</h2>
        <ul><li th:each="phone : ${contact.phones}"
                th:text="${phone.phoneType + ' ' + phone.areaCode + ' ' + phone.phoneNumber}"></li></ul>
        <h2>Correos electrónicos</h2>
        <ul><li th:each="email : ${contact.emails}" th:text="${email}"></li></ul>
        <form th:if="${canAddClient and !clientAlreadyAssigned}"
              th:action="@{/contactos/{id}/relaciones/cliente(id=${contact.id})}" method="post">
            <button type="submit">Agregar CLIENTE</button>
        </form>
        <form th:if="${canAddSupplier and !supplierAlreadyAssigned}"
              th:action="@{/contactos/{id}/relaciones/proveedor(id=${contact.id})}" method="post">
            <button type="submit">Agregar PROVEEDOR</button>
        </form>
    </section>
</main>
</body>
</html>
