<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Gestor de Contactos</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<main class="login-page">
    <section class="login-card">
    <p class="card__title">Gestor de Contactos</p>
    <h1>Iniciar sesión</h1>
    <p th:if="${param.error}" class="alert alert--error" role="alert">Usuario o contraseña incorrectos</p>
    <p th:if="${param.logout}" class="alert alert--success" role="status">Sesión cerrada correctamente.</p>
    <p th:if="${param.expired}" class="alert alert--error" role="alert">La sesión terminó. Inicia sesión nuevamente.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Usuario
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label for="password">Contraseña
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Iniciar sesión</button>
    </form>
    </section>
</main>
</body>
</html>
