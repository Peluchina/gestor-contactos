<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Gestor de Contactos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 28rem; margin: 4rem auto; padding: 0 1rem; color: #1f2937; }
        form { display: grid; gap: 1rem; }
        label { display: grid; gap: .4rem; }
        input, button { font: inherit; padding: .7rem; }
        button { cursor: pointer; }
        .message { color: #b42318; }
        .success { color: #067647; }
    </style>
</head>
<body>
<main>
    <h1>Iniciar sesión</h1>
    <p th:if="${param.error}" class="message" role="alert">Usuario o contraseña incorrectos</p>
    <p th:if="${param.logout}" class="success">Sesión cerrada correctamente.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Usuario
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label for="password">Contraseña
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
