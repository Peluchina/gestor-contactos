<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecer contraseña | Gestor de Contactos</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main>
    <a class="button button--secondary" th:href="@{/usuarios}">Cancelar y volver a usuarios</a>
    <h1>Restablecer contraseña</h1>
    <p>Usuario: <strong th:text="${user.username}"></strong></p>
    <form class="form-section" th:action="@{/usuarios/{id}/restablecer-contrasena(id=${user.id})}" th:object="${form}" method="post">
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" name="password" autocomplete="new-password" required>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></p>
        <div class="action-row"><button type="submit">Guardar contraseña</button>
            <a class="button button--secondary" th:href="@{/usuarios}">Cancelar</a></div>
    </form>
</main>
</body>
</html>
