<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecer contraseña | Gestor de Contactos</title>
</head>
<body>
<main>
    <p><a th:href="@{/usuarios}">Volver a usuarios</a></p>
    <h1>Restablecer contraseña</h1>
    <p>Usuario: <strong th:text="${user.username}"></strong></p>
    <form th:action="@{/usuarios/{id}/restablecer-contrasena(id=${user.id})}" th:object="${form}" method="post">
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" name="password" autocomplete="new-password" required>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></p>
        <button type="submit">Restablecer contraseña</button>
    </form>
</main>
</body>
</html>
